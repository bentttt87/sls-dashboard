name: Dashboard WMS PGI v99 cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache bust WMS bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'wms_integration_v94\.js\?v=[^"\']+','wms_integration_v94.js?v=20260915a',s)
          if n<1: raise SystemExit('WMS integration loader not found')
          p.write_text(s,encoding='utf-8');print('replaced',n)
          PY
      - name: Smoke test
        run: |
          node --check wms_integration_v94.js
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          idx=Path('index.html').read_text(encoding='utf-8')
          assert 'wms_integration_v94.js?v=20260915a' in idx
          src=Path('wms_integration_v94.js').read_text(encoding='utf-8')
          for key in ['Reserved RK','Pending GI','PGI Exception','available_box','pending_gi_box']:
            assert key in src,key
          for i,m in enumerate(re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',idx,re.I|re.S),1):
            if 'src=' in (m.group('attrs') or '').lower(): continue
            body=m.group('body') or ''
            if not body.strip(): continue
            p=Path('/tmp')/f'dashboard_inline_pgi_{i}.js';p.write_text(body,encoding='utf-8');subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit cache bust
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load WMS PGI v99 dashboard bridge"
          git push
