name: Dashboard v96 static smoke
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: External JavaScript syntax
        run: |
          node --check ecosystem_v72.js
          node --check wms_integration_v94.js
      - name: Inline JavaScript syntax and WMS bridge anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          assert "sbRpc('wms_my_access'" in s
          assert "['master','management','supervisor'].includes(CURRENT_ROLE)" in s
          assert 'ecosystem_v72.js?v=20260914a' in s
          assert 'wms_integration_v94.js?v=20260914a' in s
          assert s.count('wms_integration_v94.js?v=20260914a') == 1
          blocks=[]
          for m in re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',s,re.I|re.S):
              if 'src=' in (m.group('attrs') or '').lower():
                  continue
              body=m.group('body') or ''
              if body.strip(): blocks.append(body)
          for i,body in enumerate(blocks,1):
              p=Path('/tmp')/f'dashboard_inline_{i}.js'; p.write_text(body,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print('Dashboard inline blocks checked:',len(blocks))
          PY
