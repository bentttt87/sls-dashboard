name: Dashboard WMS v95 integration
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Dashboard WMS bridge
        run: python .github/patch_dashboard_wms_v95.py
      - name: Static syntax smoke
        run: |
          node --check ecosystem_v72.js
          node --check wms_integration_v94.js
          python -c "from pathlib import Path; s=Path('index.html').read_text(); assert 'wms_integration_v94.js?v=20260914a' in s; assert \"sbRpc('wms_my_access'\" in s; print('dashboard WMS bridge anchors OK')"
      - name: Commit Dashboard patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect Control Tower to live WMS v95"
          git push
