name: Dashboard WMS v94 integration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dashboard auth and WMS bridge loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const access = await sbRpc('breakage_my_access_v44', {});"
          new="const access = await sbRpc('wms_my_access', {});"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('access RPC anchor not found')

          old2="""CURRENT_ROLE = access.role;
    CURRENT_RDC_SCOPE = access.is_master ? null : access.rdc_name;"""
          new2="""CURRENT_ROLE = access.role;
    if(!['master','management','supervisor'].includes(CURRENT_ROLE)){
      errEl.textContent='Akun ini tidak memiliki akses Dashboard SLS.';
      AUTH_SESSION=null; AUTH_SESSION_OK=false; CURRENT_PASSWORD='';
      return;
    }
    CURRENT_RDC_SCOPE = ['master','management'].includes(CURRENT_ROLE) ? null : access.rdc_name;"""
          if old2 in s:
              s=s.replace(old2,new2,1)
          elif new2 not in s:
              raise SystemExit('role scope anchor not found')

          tags='''\n<script src="ecosystem_v72.js?v=20260913c"></script>\n<script src="wms_integration_v94.js?v=20260913a"></script>\n'''
          if 'wms_integration_v94.js' not in s:
              if '</body>' in s:
                  s=s.replace('</body>',tags+'</body>',1)
              elif '</html>' in s:
                  s=s.replace('</html>',tags+'</html>',1)
              else:
                  s += tags
          else:
              import re
              s=re.sub(r'ecosystem_v72\.js\?v=[^"\']+','ecosystem_v72.js?v=20260913c',s)
              s=re.sub(r'wms_integration_v94\.js\?v=[^"\']+','wms_integration_v94.js?v=20260913a',s)
          p.write_text(s,encoding='utf-8')
          print('dashboard patched')
          PY
      - name: Static syntax smoke
        run: |
          node --check ecosystem_v72.js
          node --check wms_integration_v94.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "sbRpc('wms_my_access'" in s
          assert 'wms_integration_v94.js?v=20260913a' in s
          assert 'ecosystem_v72.js?v=20260913c' in s
          print('static anchors OK')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect Control Tower to live WMS v94"
          git push
