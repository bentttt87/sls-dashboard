<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLS Management Task Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#10243d}.top{position:sticky;top:0;z-index:30;background:#245782;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.wrap{padding:20px}.btn{border:0;border-radius:9px;background:#245782;color:#fff;padding:11px 15px;font-weight:700;cursor:pointer}.btn.gray{background:#64748b}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}.card{background:#fff;border:1px solid #dbe4ed;border-radius:14px;padding:15px}.card .n{font-size:28px;font-weight:800;margin-top:4px}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;margin:12px 0}.filters input,.filters select,.modal input,.modal select,.modal textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.tablebox{background:#fff;border:1px solid #dbe4ed;border-radius:14px;overflow:auto;max-height:calc(100vh - 300px)}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1450px}th{position:sticky;top:0;background:#eaf2f9;padding:12px;text-align:left;border-bottom:1px solid #d5e0ea;z-index:2}td{padding:11px;border-bottom:1px solid #edf2f7;vertical-align:top}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}.p1{background:#fee2e2;color:#991b1b}.p2{background:#fff0d5;color:#9a5b12}.p3{background:#e0f2fe;color:#075985}.done{background:#dcfce7;color:#166534}.hold{background:#f1f5f9;color:#475569}.open{background:#e0f2fe;color:#075985}.muted{color:#64748b;font-size:12px}.progress{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden;min-width:90px}.progress span{display:block;height:100%;background:#245782}.link{border:0;background:none;color:#245782;font-weight:800;cursor:pointer}.login{max-width:430px;margin:8vh auto;padding:15px}.brandrow{display:flex;align-items:center;gap:14px}.brandrow img{height:42px;width:auto}.brand{font-size:24px;font-weight:900;color:#c01920}.brand span{color:#243b53;margin-left:10px;padding-left:10px;border-left:1px solid #cbd5e1}.login .card{padding:24px}.login input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;margin:6px 0 13px}.notice{padding:10px 12px;border-radius:8px;background:#eaf4ff;color:#124c7d;margin:10px 0}.error{background:#fee2e2;color:#991b1b}.modalbg{position:fixed;inset:0;background:#0f172a88;display:flex;align-items:center;justify-content:center;z-index:100}.modal{width:min(900px,95vw);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.modal label{font-size:12px;font-weight:800;display:block;margin:8px 0 4px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.title{font-size:20px;font-weight:800}.userline{font-size:13px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.wrap{padding:10px}.top{padding:14px}.title{font-size:16px}.userline{font-size:11px}.tablebox{max-height:calc(100vh - 390px)}}
</style>
</head>
<body><div id="root"></div>
<script>
(function(){
const SB='https://mfdckngkvjnemwgmkiiv.supabase.co';
const KEY='sb_publishable_WX4GPpdK8bONmiG2r89XQQ_VceEu6Mi';
const root=document.getElementById('root');
let session=null,role=null,tasks=[],editing=null,msg='',err='';
try{session=JSON.parse(localStorage.getItem('sls_tt_session')||'null')}catch(e){session=null}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function h(extra){const x={'apikey':KEY,'Content-Type':'application/json'};if(session&&session.access_token)x.Authorization='Bearer '+session.access_token;return Object.assign(x,extra||{})}
async function refresh(){if(!session||!session.refresh_token)return false;const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;session=await r.json();localStorage.setItem('sls_tt_session',JSON.stringify(session));return true}
async function api(path,opt){opt=opt||{};opt.headers=h(opt.headers);let r=await fetch(SB+path,opt);if(r.status===401&&await refresh()){opt.headers=h(opt.headers);r=await fetch(SB+path,opt)}return r}
async function signIn(email,password){const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'Login gagal');session=d;localStorage.setItem('sls_tt_session',JSON.stringify(session));await load()}
async function load(){if(!session||!session.user)throw new Error('Sesi login tidak ditemukan.');let r=await api('/rest/v1/user_roles?select=role,rdc_name&user_id=eq.'+encodeURIComponent(session.user.id)+'&is_active=eq.true&limit=1');if(!r.ok)throw new Error('Gagal membaca hak akses ('+r.status+').');const roles=await r.json();role=roles[0]||null;if(!role||!['master','management','rdc_manager'].includes(String(role.role).toLowerCase()))throw new Error('Akses Task Tracker hanya untuk Master, Management, dan RDC Manager.');r=await api('/rest/v1/management_tasks?select=*&order=target_date.asc.nullslast,task_code.asc');if(!r.ok)throw new Error('Gagal membaca task ('+r.status+').');tasks=await r.json()}
function due(t){if(!t.target_date)return 'No target';if(t.status==='Completed')return 'Completed';const d=new Date(t.target_date+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);const n=Math.ceil((d-today)/86400000);return n<0?'OVERDUE':n===0?'DUE TODAY':n<=7?'Due <=7d':'On track'}
function canDelete(){return role&&['master','management'].includes(String(role.role).toLowerCase())}
function kpis(){return [['Total',tasks.length],['Active',tasks.filter(x=>x.status!=='Completed'&&x.status!=='Hold').length],['P1',tasks.filter(x=>x.priority==='P1'&&x.status!=='Completed').length],['Overdue',tasks.filter(x=>due(x)==='OVERDUE').length],['Decision',tasks.filter(x=>x.decision_needed&&x.status!=='Completed').length],['Completed',tasks.filter(x=>x.status==='Completed').length]]}
function loginView(){root.innerHTML='<div class="login"><div class="card"><div class="brandrow"><img src="roman-logo.png" alt="ROMAN"><div class="brand">ROMAN <span>QUADRA</span></div></div><h2>SLS Management Task Tracker</h2><div class="muted">PR Management • RDC • Project • National</div>'+(err?'<div class="notice error">'+esc(err)+'</div>':'')+'<form id="lf"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="pass" type="password" required><button class="btn" style="width:100%">LOGIN</button></form></div></div>';document.getElementById('lf').onsubmit=async e=>{e.preventDefault();err='';try{await signIn(document.getElementById('email').value.trim(),document.getElementById('pass').value);render()}catch(ex){session=null;localStorage.removeItem('sls_tt_session');err=ex.message;loginView()}}}
function row(t){const pc=t.priority==='P1'?'p1':t.priority==='P2'?'p2':'p3',sc=t.status==='Completed'?'done':t.status==='Hold'?'hold':'open';return '<tr><td><b>'+esc(t.task_code)+'</b></td><td>'+esc(t.level)+'</td><td>'+esc(t.rdc_area||'')+'</td><td>'+esc(t.project_topic)+'</td><td>'+esc(t.task_action)+'</td><td>'+esc(t.pic||'')+'</td><td><span class="pill '+pc+'">'+esc(t.priority)+'</span></td><td>'+esc(t.target_date||'—')+'<div class="muted">'+due(t)+'</div></td><td><span class="pill '+sc+'">'+esc(t.status)+'</span></td><td>'+Number(t.progress||0)+'%<div class="progress"><span style="width:'+Number(t.progress||0)+'%"></span></div></td><td>'+esc(t.next_action||'')+'</td><td>'+(t.decision_needed?'YES':'—')+'</td><td><button class="link" data-edit="'+t.id+'">Edit</button>'+(canDelete()?' <button class="link" style="color:#b91c1c" data-del="'+t.id+'">Delete</button>':'')+'</td></tr>'}
function render(){if(!session)return loginView();root.innerHTML='<div class="top"><div class="title">SLS MANAGEMENT TASK TRACKER</div><div class="userline">'+esc(session.user.email||'')+' · '+esc(role?role.role:'')+' &nbsp; <button id="out" class="link" style="color:white">Logout</button></div></div><div class="wrap"><button id="add" class="btn">＋ Add Task</button>'+(msg?'<div class="notice">'+esc(msg)+'</div>':'')+(err?'<div class="notice error">'+esc(err)+'</div>':'')+'<div class="cards">'+kpis().map(x=>'<div class="card"><div>'+x[0]+'</div><div class="n">'+x[1]+'</div></div>').join('')+'</div><div class="filters"><input id="search" placeholder="Cari task / topik / PIC / area"><select id="level"><option value="">Semua Level</option><option>RDC</option><option>Project</option><option>National</option></select><select id="area"><option value="">Semua Area</option>'+Array.from(new Set(tasks.map(x=>x.rdc_area).filter(Boolean))).sort().map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><select id="prio"><option value="">Semua Priority</option><option>P1</option><option>P2</option><option>P3</option></select><select id="status"><option value="">Semua Status</option>'+['Open','Data Collection','Analysis','Action','Monitoring','Completed','Hold'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="tablebox"><table><thead><tr><th>ID</th><th>Level</th><th>Area</th><th>Topik</th><th>Task</th><th>PIC</th><th>Priority</th><th>Target</th><th>Status</th><th>Progress</th><th>Next Action</th><th>Decision</th><th>Aksi</th></tr></thead><tbody>'+tasks.map(row).join('')+'</tbody></table></div></div>';document.getElementById('out').onclick=logout;document.getElementById('add').onclick=()=>openModal(null);['search','level','area','prio','status'].forEach(id=>document.getElementById(id).oninput=filter);wire()}
function filter(){const s=document.getElementById('search').value.toLowerCase(),lv=document.getElementById('level').value,ar=document.getElementById('area').value,pr=document.getElementById('prio').value,st=document.getElementById('status').value;const a=tasks.filter(t=>(!s||[t.task_code,t.rdc_area,t.project_topic,t.task_action,t.pic].some(v=>String(v||'').toLowerCase().includes(s)))&&(!lv||t.level===lv)&&(!ar||t.rdc_area===ar)&&(!pr||t.priority===pr)&&(!st||t.status===st));document.querySelector('tbody').innerHTML=a.map(row).join('');wire()}
function wire(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(tasks.find(t=>t.id===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delTask(b.dataset.del))}
function openModal(t){editing=t;const x=t||{};document.body.insertAdjacentHTML('beforeend','<div class="modalbg" id="mb"><div class="modal"><h2>'+(t?'Edit Task':'Add Task')+'</h2><div class="grid3"><div><label>Level</label><select id="mlevel">'+['RDC','Project','National'].map(v=>'<option '+((x.level||'RDC')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div><label>Area / RDC</label><input id="marea" value="'+esc(x.rdc_area||'')+'"></div><div><label>Priority</label><select id="mprio">'+['P1','P2','P3'].map(v=>'<option '+((x.priority||'P2')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div></div><div class="grid2"><div><label>Project / Topik</label><input id="mtopic" value="'+esc(x.project_topic||'')+'"></div><div><label>PIC</label><input id="mpic" value="'+esc(x.pic||'')+'"></div></div><label>Task / Action</label><textarea id="maction">'+esc(x.task_action||'')+'</textarea><label>Detail / Output</label><textarea id="mdetail">'+esc(x.detail_output||'')+'</textarea><div class="grid3"><div><label>Target Date</label><input id="mtarget" type="date" value="'+esc(x.target_date||'')+'"></div><div><label>Status</label><select id="mstatus">'+['Open','Data Collection','Analysis','Action','Monitoring','Completed','Hold'].map(v=>'<option '+((x.status||'Open')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div><label>Progress %</label><input id="mprogress" type="number" min="0" max="100" value="'+Number(x.progress||0)+'"></div></div><label>Next Action</label><textarea id="mnext">'+esc(x.next_action||'')+'</textarea><label>Issue / Blocker</label><textarea id="missue">'+esc(x.issue_blocker||'')+'</textarea><div class="grid2"><div><label>Decision Needed</label><select id="mdecision"><option value="false" '+(!x.decision_needed?'selected':'')+'>No</option><option value="true" '+(x.decision_needed?'selected':'')+'>Yes</option></select></div><div><label>Management Decision</label><textarea id="mmgmt">'+esc(x.management_decision||'')+'</textarea></div></div><div class="actions"><button id="cancel" class="btn gray">Cancel</button><button id="save" class="btn">Save</button></div></div></div>');document.getElementById('cancel').onclick=()=>document.getElementById('mb').remove();document.getElementById('mstatus').onchange=e=>{if(e.target.value==='Completed')document.getElementById('mprogress').value=100};document.getElementById('save').onclick=saveTask}
async function saveTask(){const status=document.getElementById('mstatus').value;let progress=Math.max(0,Math.min(100,Number(document.getElementById('mprogress').value||0)));if(status==='Completed')progress=100;const p={level:document.getElementById('mlevel').value,rdc_area:document.getElementById('marea').value.trim()||null,project_topic:document.getElementById('mtopic').value.trim(),task_action:document.getElementById('maction').value.trim(),detail_output:document.getElementById('mdetail').value.trim()||null,pic:document.getElementById('mpic').value.trim()||null,priority:document.getElementById('mprio').value,target_date:document.getElementById('mtarget').value||null,status,progress,next_action:document.getElementById('mnext').value.trim()||null,issue_blocker:document.getElementById('missue').value.trim()||null,decision_needed:document.getElementById('mdecision').value==='true',management_decision:document.getElementById('mmgmt').value.trim()||null,updated_by:session.user.id};if(!p.project_topic||!p.task_action){alert('Topik dan Task wajib diisi.');return}let path,opt;if(editing){path='/rest/v1/management_tasks?id=eq.'+encodeURIComponent(editing.id);opt={method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(p)}}else{const pre=p.level==='RDC'?'RDC':p.level==='Project'?'PRJ':'NAT';const nums=tasks.filter(t=>String(t.task_code).startsWith(pre+'-')).map(t=>Number(String(t.task_code).split('-')[1])||0);p.task_code=pre+'-'+String(Math.max(0,...nums)+1).padStart(3,'0');p.created_by=session.user.id;path='/rest/v1/management_tasks';opt={method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(p)}}const r=await api(path,opt);if(!r.ok){alert('Gagal menyimpan: '+await r.text());return}document.getElementById('mb').remove();await load();msg='Task berhasil disimpan.';render()}
async function delTask(id){if(!confirm('Hapus task ini?'))return;const r=await api('/rest/v1/management_tasks?id=eq.'+encodeURIComponent(id),{method:'DELETE'});if(!r.ok){alert('Gagal menghapus task.');return}await load();msg='Task berhasil dihapus.';render()}
async function logout(){try{await api('/auth/v1/logout',{method:'POST'})}catch(e){}session=null;role=null;tasks=[];localStorage.removeItem('sls_tt_session');render()}
async function init(){if(session){try{await load()}catch(e){err=e.message;session=null;localStorage.removeItem('sls_tt_session')}}render()}
init();
})();
</script>
</body>
</html>
